<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dupin</title>
    <style>
      :root {
        --canvas: #f7f7f4;
        --ink: #26251e;
        --muted: #807d72;
        --primary: #f54e00;
        --hairline: #e6e5e0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #161613;
          --ink: #f3f2ec;
          --muted: #8f8c80;
          --hairline: #2d2c26;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--primary);
        color: #ffffff;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 16px;
        font-weight: 500;
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">D</div>
      <h1>Dupin</h1>
      <p id="status">Đang khởi động Local-First OSINT Engine (127.0.0.1:8000)…</p>
    </div>
  </body>
</html>
