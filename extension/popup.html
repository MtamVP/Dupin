<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Stalker++ Companion</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      background: #141519;
      color: #eceff4;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 12px;
    }
    .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; }
    .badge { width: 22px; height: 22px; border-radius: 6px; background: #3b82f6; color: #fff; display: grid; place-items: center; font-family: monospace; font-size: 11px; }
    label { display: block; font-size: 11px; color: #a7b1c2; margin: 8px 0 4px; }
    select, input, textarea {
      width: 100%; box-sizing: border-box; border-radius: 7px;
      border: 1px solid #33384a; background: #1c1f29; color: #eceff4;
      padding: 7px 9px; font-size: 12px; outline: none;
    }
    textarea { min-height: 82px; resize: vertical; font-family: inherit; }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    button {
      flex: 1; height: 32px; border-radius: 7px; border: 1px solid #33384a;
      background: #232732; color: #eceff4; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { margin-top: 8px; font-size: 11px; color: #94a3b8; min-height: 16px; }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="brand"><span class="badge">S+</span> Stalker++ Clipper</div>
    <span style="font-size:10px;color:#22c55e;">Local-Only</span>
  </div>

  <label for="wsSelect">Cuộc điều tra đích (localhost:8000)</label>
  <select id="wsSelect"><option value="">Đang tải...</option></select>

  <label for="fieldKey">Nhãn thông tin</label>
  <input id="fieldKey" value="Browser Clip" />

  <label for="clipText">Nội dung công khai (bôi đen trên trang hoặc tự chỉnh)</label>
  <textarea id="clipText" placeholder="Đang đọc vùng văn bản đang chọn..."></textarea>

  <div class="row">
    <button id="sendPinBtn" class="primary">Lưu vào Hồ sơ</button>
    <button id="sendAnalyzeBtn">Lưu + Phân tích</button>
  </div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
