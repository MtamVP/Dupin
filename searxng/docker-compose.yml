services:
  searxng:
    image: searxng/searxng:latest
    container_name: stalker-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=stalker-local-osint-searxng-secret-2026
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
