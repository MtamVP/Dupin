# Local-first SearXNG config for Stalker++ (JSON API enabled, bound to 127.0.0.1:8888)
use_default_settings: true

general:
  debug: false
  instance_name: "Stalker++ Local SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "vi"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "stalker-local-osint-searxng-secret-2026"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  pool_connections: 60
  pool_maxsize: 20

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: yahoo
    engine: yahoo
    shortcut: yh
    disabled: false
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
